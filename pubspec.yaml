name: bgtask
description: A Flutter application demonstrating persistent foreground and background task execution on both Android and iOS, with auto-restart capabilities.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Foreground service management (Android) and background tasks
  flutter_foreground_task: ^8.0.0

  # Persistent background scheduling (Android - WorkManager)
  workmanager: ^0.5.2

  # iOS background execution via BGTaskScheduler
  background_fetch: ^1.2.0

  # Dependency injection / service locator
  get_it: ^7.6.0

  # SQLite database
  sqflite: ^2.3.0

  # File system path utilities
  path: ^1.9.0

  # File system access
  path_provider: ^2.1.0

  # State management
  get: ^4.6.5

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
